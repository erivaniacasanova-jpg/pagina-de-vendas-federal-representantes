    <!-- Correção de compatibilidade para ambientes com getter-only fetch -->
    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _activeFetch = _origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _activeFetch; },
              set: function(val) { _activeFetch = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return _activeFetch; },
                  set: function(val) { _activeFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>

    <!-- Metatags Open Graph (WhatsApp, Facebook, etc.) -->
